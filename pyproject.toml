[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flclash-diversion-skills"
version = "0.1.0"
description = "A privacy-safe CLI utility and Codex/Claude skill for merging FlClash/Mihomo profiles with precise domain diversion."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["flclash", "mihomo", "clash", "proxy", "diversion", "profile"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = [
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/FlClash/flclash-diversion-skills"
Issues = "https://github.com/FlClash/flclash-diversion-skills/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
