mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: Proxy-A
    type: direct
  - name: Proxy-B
    type: direct
  - name: Proxy-C
    type: direct

proxy-groups:
  - name: Main
    type: select
    proxies:
      - Proxy-A
      - Proxy-B
      - Proxy-C
      - DIRECT

rules:
  - DOMAIN-SUFFIX,example.com,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,Main
